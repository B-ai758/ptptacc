<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ptptacc.vn</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #f5f5f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .web-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 450px;
            padding: 30px 25px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .domain-title {
            font-size: 24px;
            font-weight: 700;
            color: #1d1d1f;
            margin-bottom: 8px;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            background-color: #e8f5e9;
            color: #2e7d32;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .content-box {
            background-color: #fafafa;
            border: 2px dashed #e0e0e0;
            border-radius: 12px;
            padding: 40px 20px;
            margin-bottom: 20px;
        }

        .content-box p {
            color: #86868b;
            font-size: 14px;
        }

        .btn {
            background-color: #0066cc;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }

        .btn:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="web-card">
        <h1 class="domain-title">ptptacc.vn</h1>
        <div class="status-badge">● Trạng thái: Đang hoạt động</div>
        
        <div class="content-box">
            <p>Khung nội dung trang web trắng của bạn ở đây.</p>
        </div>

        <button class="btn" onclick="chaoBan()">Thử bấm vào đây</button>
    </div>

    <script>
        function chaoBan() {
            alert("Chúc mừng! Bạn đã chạy thành công web ptptacc.vn trên điện thoại!");
        }
    </script>
</body>
</html>
